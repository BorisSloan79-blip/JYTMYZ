<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Space</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <div class="user-status">
            <span>👸 彤彤</span>
            <span style="margin:0 5px; color:#DDD;">|</span>
            <span>👨‍🍳 马永哲</span>
        </div>
        <div class="heart-balance" id="earn-love-btn">
            <span>❤</span>
            <span id="love-balance">0</span>
            <span style="font-size:10px; margin-left:5px; opacity:0.8;">赚爱心</span>
        </div>
    </div>

    <div id="tab-order" class="content active">
        <div class="card" style="background:#FFF0F3;">
            <h3 style="color:var(--primary); margin-bottom:5px;">马大厨的私房菜单 🍳</h3>
            <p style="font-size:12px; color:#888;">今日特供：无猪肉健康料理</p>
        </div>
        
        <div id="menu-list">
            </div>

        <div style="position:fixed; bottom:70px; left:20px; right:20px; background:var(--text-main); color:white; padding:15px; border-radius:50px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 10px 20px rgba(0,0,0,0.2);">
            <div id="cart-count" style="font-size:14px; padding-left:10px;">还没选好吃的~</div>
            <button id="submit-order" style="background:var(--primary); border:none; color:white; padding:8px 20px; border-radius:20px; font-weight:bold;">生成订单</button>
        </div>
    </div>

    <div id="tab-day" class="content">
        <div class="card">
            <h3>📅 马永哲与彤彤的一天</h3>
            <p style="font-size:12px; color:#999; margin-top:5px;">模拟我们理想中的平凡一日</p>
        </div>
        <div id="timeline-box" style="padding:10px;">
            </div>
    </div>

    <div id="tab-card" class="content">
        <div style="text-align:center; margin-top:20px;">
            <h2 style="color:var(--text-main);">灵魂共振卡牌 ✨</h2>
            <p style="font-size:14px; color:#888; margin-top:10px;">不知道聊什么？让马永哲陪你玩个游戏</p>
        </div>

        <div class="card-deck">
           <!-- 抽卡卡牌 -->
<div class="card-scene">
  <div class="topic-card" id="topicCard">

    <!-- 正面 -->
    <div class="card-face card-front">
      <div class="front-text">点击抽取今日话题 💗</div>
    </div>

    <!-- 背面 -->
    <div class="card-face card-back" id="cardBack">
      <!-- JS 会往这里塞内容 -->
    </div>

  </div>
</div>
                <div style="font-size:14px; margin-top:10px;">点击抽取今日话题</div>
            </div>
            <div class="card-back"></div>
        </div>
        
        <div id="card-result" class="card" style="display:none; text-align:center; background:#FFF8F0;"></div>

        <button id="draw-card-btn" class="btn" style="margin-top:20px;">抽取话题卡</button>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" data-tab="tab-order">
            <span style="font-size:20px;">🍱</span>
            <span>点单</span>
        </div>
        <div class="tab-item" data-tab="tab-day">
            <span style="font-size:20px;">☀</span>
            <span>陪伴</span>
        </div>
        <div class="tab-item" data-tab="tab-card">
            <span style="font-size:20px;">💬</span>
            <span>话题</span>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
